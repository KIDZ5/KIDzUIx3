name: KIDzUIx3 Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x

      - name: Install Zensical
        run: pip install zensical

      - name: Inject KIDzUIx3 version into English and Thai docs
        run: |
          VERSION="v$(sed -n 's/^version = "\([^"]*\)"/\1/p' wally.toml | head -n 1)"
          sed -i "s/{{LATEST_VERSION}}/${VERSION}/g" "docs/Getting Started/importing-the-library.md"
          sed -i "s/{{LATEST_VERSION}}/${VERSION}/g" "docs-th/Getting Started/importing-the-library.md"

      - name: Build English documentation
        run: zensical build --config-file zensical.en.toml --clean

      - name: Build Thai documentation
        run: zensical build --config-file zensical.th.toml --clean

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - uses: actions/deploy-pages@v5
        id: deployment
