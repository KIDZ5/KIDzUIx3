[project.theme]
name = "material"
favicon = "assets/kidzuix3-favicon-v3-20260824.png"
logo = "assets/logo.svg"

features = [
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.instant",
    "navigation.instant.progress",
    "navigation.tracking",
    "navigation.sections",
    "navigation.expand",
    "navigation.path",
    "navigation.indexes",
    "navigation.top",
    "navigation.footer",
    "toc.follow",
    "search.suggest",
    "content.action.edit",
    "content.action.view",
    "content.code.copy",
    "content.code.select",
    "content.code.annotate",
]

language = "th"
[project.theme.icon]
repo = "fontawesome/brands/github"
edit = "material/pencil"
view = "material/eye"

[project.theme.font]
text = "Roboto"
code = "Roboto Mono"

[[project.theme.palette]]
scheme = "slate"
primary = "light blue"
accent = "light blue"
toggle.icon = "material/toggle-switch"
toggle.name = "เปลี่ยนเป็นโหมดสว่าง"

[[project.theme.palette]]
scheme = "default"
primary = "light blue"
accent = "light blue"
toggle.icon = "material/toggle-switch-off-outline"
toggle.name = "เปลี่ยนเป็นโหมดมืด"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.snippets]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tasklist]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.extra]
generator = false

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/KIDZ5/KIDzUIx3"

